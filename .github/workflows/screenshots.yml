name: Screenshots

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MAGICK_VERSION: 7.1.2-35
      MAGICK_SHA256: f111044ed06b68cfb478df724c5a32d35145afa21073242f888d234a2f8cc002
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ImageMagick 7
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/magick" \
            "https://github.com/ImageMagick/ImageMagick/releases/download/$MAGICK_VERSION/ImageMagick-$MAGICK_VERSION-gcc-x86_64.AppImage"
          echo "$MAGICK_SHA256  $RUNNER_TEMP/bin/magick" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Check screenshots match each addon's docs/screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: scripts/sync-screenshots.sh --check
      - name: Check the Made with players section matches each addon's THIRD_PARTY.md
        run: python3 scripts/sync-credits.py --check

  # A scheduled check that fails quietly lets the site fall behind the addons: keep one open issue
  # naming the stale assets, and close that issue on the next scheduled run that passes. The title is
  # deliberately distinct from #14, so a passing run never closes the issue that tracked this repair.
  report:
    needs: check
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Scheduled screenshot check failed
          FAILED: ${{ needs.check.result != 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$TITLE\") | .number")
          issue=${issue%%$'\n'*}
          if [ "$FAILED" = true ]; then
            body="A site image or the Made with players section no longer matches the addons' current renders: $RUN_URL

          Read the failing check in that run. From a fresh worktree run \`scripts/sync-screenshots.sh\` and \`python3 scripts/sync-credits.py\` against the addons' current \`main\`, review the changed images, and ship them together. The sources are generated renders, not in-game captures. The next scheduled run that passes closes this issue."
            if [ -n "$issue" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$issue/comments" -f body="Failed again: $RUN_URL" >/dev/null
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues" \
                -f title="$TITLE" -f body="$body" -f "assignees[]=$GITHUB_REPOSITORY_OWNER" >/dev/null
            fi
          elif [ -n "$issue" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$issue/comments" \
              -f body="The screenshots and credits match again: $RUN_URL" >/dev/null
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$issue" \
              -f state=closed -f state_reason=completed >/dev/null
          fi
