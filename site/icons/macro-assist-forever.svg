<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Macro Assist Forever</title>
  <defs>
    <!-- Family palette: keep these four gradients unchanged in every addon. -->
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a2a1c"/>
      <stop offset="1" stop-color="#120c08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#7a4f14"/>
    </linearGradient>
    <linearGradient id="emblem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.5" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#b3741c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Frame and background: identical in every addon. -->
  <rect x="6" y="6" width="244" height="244" rx="28" fill="url(#gold)"/>
  <rect x="16" y="16" width="224" height="224" rx="20" fill="url(#bg)"/>

  <!-- Emblem: a macro line with code brackets and a text cursor. -->
  <g transform="translate(4 5)" fill="#000" opacity="0.45">
    <path d="M90 70 L48 128 L90 186 L112 166 L92 128 L112 90 Z"/>
    <path d="M166 70 L208 128 L166 186 L144 166 L164 128 L144 90 Z"/>
    <path d="M126 166 H188 V190 H126 Z"/>
  </g>
  <g fill="url(#emblem)" stroke="#5a360c" stroke-width="5" stroke-linejoin="round">
    <path d="M90 70 L48 128 L90 186 L112 166 L92 128 L112 90 Z"/>
    <path d="M166 70 L208 128 L166 186 L144 166 L164 128 L144 90 Z"/>
    <path d="M126 166 H188 V190 H126 Z"/>
  </g>
  <path d="M93 82 L67 128 L93 174 L101 168 L78 128 L101 88 Z" fill="url(#shine)"/>
</svg>
